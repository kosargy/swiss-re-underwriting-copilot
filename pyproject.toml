[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-re-underwriting"
version = "0.1.0"
description = "Auditable valuation engine for Swiss residential real estate underwriting."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "plotly>=5.24",
    "reportlab>=4.2",
    "streamlit>=1.40",
]

[project.scripts]
underwrite = "underwriting.cli:main"

[tool.setuptools.packages.find]
include = ["underwriting*"]
